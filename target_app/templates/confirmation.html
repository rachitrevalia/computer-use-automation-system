<html>
<head><title>LegacyBank - Confirmation</title></head>
<body bgcolor="#f0f0f0">
<table width="100%" cellpadding="0" cellspacing="0"><tr>
  <td bgcolor="#003366"><font color="white" size="5">&nbsp;LegacyBank Teller Terminal v3.2</font></td>
</tr></table>
<br>
<div style="margin-left:20px;">
<table border="1" cellpadding="8"><tr><td>
  <table>
    <tr><td colspan="2" bgcolor="#ccffcc"><b>Sub-Account Opened Successfully</b></td></tr>
    <tr><td>Confirmation Number:</td><td><span>{{ record.sub_account_id }}</span></td></tr>
    <tr><td>Account Type:</td><td>{{ record.type }}</td></tr>
    <tr><td>Initial Deposit:</td><td>${{ "%.2f"|format(record.deposit) }}</td></tr>
    <tr><td>Member:</td><td>{{ member.name }} ({{ member.id }})</td></tr>
  </table>
</td></tr></table>
</div>
</body>
</html>
